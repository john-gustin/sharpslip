<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SharpSlip">
  <title>SharpSlip</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand"><img src="icon.svg" alt=""> SharpSlip</div>
    <button id="bookBtn" class="bookchip" data-act="pickbook" aria-label="Choose your sportsbook">Pick book ▾</button>
  </header>

  <div class="modebar">
    <div class="seg" role="tablist" aria-label="Pick mode">
      <button data-mode="value">💰 Value</button>
      <button data-mode="safe">🛡️ Safe</button>
    </div>
    <button id="refreshBtn" class="iconbtn" aria-label="Refresh odds">↻</button>
  </div>
  <div id="modehelp" class="modehelp"></div>
  <div id="status" class="status"></div>

  <main id="view"></main>

  <nav class="tabs">
    <button data-tab="picks"><span>🎯</span>Picks</button>
    <button data-tab="parlay"><span>🧩</span>Parlay</button>
    <button data-tab="props"><span>🏟️</span>Games</button>
    <button data-tab="settings"><span>⚙️</span>Settings</button>
  </nav>

  <dialog id="bookDialog">
    <div class="dlghead"><b>Which book are you using?</b><button class="iconbtn" data-close>✕</button></div>
    <div id="bookList"></div>
  </dialog>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
